<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cinta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E8B6A" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#22303A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7E5AA2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="frente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B6A"/>
      <stop offset="1" stop-color="#7E5AA2"/>
    </linearGradient>
    <radialGradient id="orbeJade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E8B6A" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#2E8B6A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E8B6A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbeJac" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E5AA2" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#7E5AA2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7E5AA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbeBrasa" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9A05B" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#D9A05B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D9A05B" stop-opacity="0"/>
    </radialGradient>
    <filter id="suave"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.79  0 0 0 0 0.84  0 0 0 0 0.83  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#06281E"/>

  <g fill="none" stroke="#C9D6D3">
    <circle cx="960" cy="540" r="430" stroke-opacity="0.10" stroke-width="1.2"/>
    <circle cx="960" cy="540" r="470" stroke-opacity="0.06" stroke-width="1"/>
  </g>
  <g fill="#C9D6D3" fill-opacity="0.35">
    <circle cx="240" cy="180" r="2"/><circle cx="1700" cy="240" r="2.5"/>
    <circle cx="1500" cy="900" r="2"/><circle cx="420" cy="930" r="1.8"/>
    <circle cx="960" cy="120" r="1.5"/>
  </g>

  <!-- Orbe A: pasa POR DETRÁS de la cinta -->
  <circle cx="340" cy="540" r="140" fill="url(#orbeJade)"/>
  <circle cx="340" cy="540" r="26" fill="#2E8B6A"/>

  <!-- Cinta de Möbius: capa trasera (lemniscata completa) -->
  <path d="M 960 540 C 780 320, 340 320, 340 540 C 340 760, 780 760, 960 540
           C 1140 320, 1580 320, 1580 540 C 1580 760, 1140 760, 960 540"
        fill="none" stroke="url(#cinta)" stroke-width="110" stroke-linecap="round"/>

  <!-- Orbe C: ENHEBRADO en la torsión (entre trasera y delantera) -->
  <circle cx="960" cy="540" r="70" fill="url(#orbeBrasa)"/>
  <circle cx="960" cy="540" r="14" fill="#D9A05B"/>

  <!-- Sombra de la capa delantera sobre la trasera -->
  <path d="M 870 430 C 900 465, 1020 615, 1050 650"
        fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="132"
        stroke-linecap="round" filter="url(#suave)"/>

  <!-- Capa delantera: el cruce de la torsión -->
  <path d="M 870 430 C 900 465, 1020 615, 1050 650"
        fill="none" stroke="url(#frente)" stroke-width="110" stroke-linecap="round"/>
  <path d="M 870 430 C 900 465, 1020 615, 1050 650"
        fill="none" stroke="#C9D6D3" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- Orbe B: flota POR DELANTE de la cinta -->
  <circle cx="1580" cy="540" r="170" fill="url(#orbeJac)"/>
  <circle cx="1580" cy="540" r="30" fill="#7E5AA2"/>

  <rect width="1920" height="1080" filter="url(#grano)" opacity="0.4"/>
</svg>
