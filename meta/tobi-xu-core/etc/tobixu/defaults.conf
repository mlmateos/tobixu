# /etc/tobixu/defaults.conf — semillas del trigger de primer arranque
# Doctrina 13: los defaults son semillas, no cadenas.
# El sistema siembra una vez; despues el usuario cosecha y modifica.
#
# Para re-sembrar con otros valores: edita este archivo y luego
#   sudo rm /var/lib/tobixu/.first-boot-done
#   sudo systemctl start tobixu-first-boot.service
#
# Interruptores (1=aplicar, 0=omitir):
APPLY_LOCALES=1
APPLY_SOURCES=1
APPLY_DOOR=1
APPLY_GRUB=1
# Semillas de locales (triada v2):
DEF_LANG=en_US.UTF-8
DEF_LC_TIME=en_GB.UTF-8
DEF_LC_METRIC=es_MX.UTF-8
